name: full test

# 完整测试：pull request、合并到 main、手动触发
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-versions:
    name: list python versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        name: 3.8 to the latest stable release from the setup-python manifest
        run: |
          curl -sSfL -o "$RUNNER_TEMP/versions-manifest.json" \
            https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
          versions=$(python3 .github/scripts/python_versions.py "$RUNNER_TEMP/versions-manifest.json" 24.04)
          echo "python versions: $versions" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  python:
    name: python ${{ matrix.python-version }}
    needs: python-versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -W error -m py_compile prom-textfile.py tests/test_prom_textfile.py tests/test_remote_write.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  distro:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 使用发行版自带的 python3；默认 python3 为 3.6 的发行版改用官方源里的 python3.11
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y python3 git
            python: python3
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y python3 git
            python: python3
          - image: debian:12
            install: apt-get update && apt-get install -y python3 git
            python: python3
          - image: debian:13
            install: apt-get update && apt-get install -y python3 git
            python: python3
          - image: registry.access.redhat.com/ubi8/ubi
            install: dnf install -y python3.11 git tar
            python: python3.11
          - image: registry.access.redhat.com/ubi9/ubi
            install: dnf install -y python3 git tar
            python: python3
          - image: registry.access.redhat.com/ubi10/ubi
            install: dnf install -y python3 git tar
            python: python3
          - image: fedora:latest
            install: dnf install -y python3 git tar
            python: python3
          - image: amazonlinux:2023
            install: dnf install -y python3 git tar
            python: python3
          - image: opensuse/leap:15.6
            install: zypper -n install python311 git tar gzip
            python: python3.11
          - image: opensuse/tumbleweed
            install: zypper -n install python3 git tar gzip
            python: python3
    steps:
      - name: Install python
        run: ${{ matrix.install }}
      - uses: actions/checkout@v5
      - name: Python version
        run: ${{ matrix.python }} --version
      - name: Syntax check
        run: ${{ matrix.python }} -W error -m py_compile prom-textfile.py tests/test_prom_textfile.py tests/test_remote_write.py
      - name: Unit tests
        run: ${{ matrix.python }} -m unittest discover -s tests -v

  integration:
    needs: [python, distro]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Integration test with node_exporter
        run: tests/integration.sh
      - name: Install htpasswd
        run: sudo apt-get update && sudo apt-get install -y apache2-utils
      - name: Integration test with prometheus remote write
        run: tests/integration_remote_write.sh
      - name: Root scenario (sudo, -c file, stale /tmp counter)
        run: tests/root_scenario.sh
